name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  DEFMT_LOG: trace

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "tracing", "log", "defmt", "tracing,log", "tracing,defmt", "log,defmt", "tracing,log,defmt"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Rust
      # Compile-fail snapshots include compiler diagnostics; update them with Rust.
      uses: dtolnay/rust-toolchain@1.98.1
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check feature unification fixture formatting
      run: cargo fmt --manifest-path test_feature_unification/Cargo.toml --all -- --check
    - name: Test workspace
      run: cargo test --workspace --no-default-features --features '${{ matrix.features }}'
    - name: Check no_std and renamed dependency
      working-directory: test_no_std
      run: cargo check --lib --no-default-features --features '${{ matrix.features }}'
    - name: Check library with no backend selected
      if: matrix.features == ''
      run: cargo check --manifest-path test_feature_unification/Cargo.toml -p feature_free_library
    - name: Test backends selected only by the parent
      working-directory: test_feature_unification
      run: cargo run --no-default-features --features '${{ matrix.features }}'
    - name: Test no_std
      if: matrix.features == ''
      run: rustup target add x86_64-unknown-linux-gnu && cd test_no_std && cargo run

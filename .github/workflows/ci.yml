name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  DEFMT_LOG: trace

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "tracing", "log", "defmt", "tracing,log", "tracing,defmt", "log,defmt", "tracing,log,defmt"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        components: rustfmt
        override: true
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Test workspace
      run: cargo test --workspace --no-default-features --features '${{ matrix.features }}'
    - name: Check no_std and renamed dependency
      working-directory: test_no_std
      run: cargo check --lib --no-default-features --features '${{ matrix.features }}'
    - name: Test no_std
      if: matrix.features == ''
      run: rustup target add x86_64-unknown-linux-gnu && cd test_no_std && cargo run

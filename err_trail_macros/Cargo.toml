[package]
name = "err_trail_macros"
description = "Macros for the err_trail crate"
version = "0.11.1"
edition = "2024"
license = "Apache-2.0"
documentation = "https://docs.rs/err_trail"
repository = "https://github.com/mcmah309/err_trail"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
proc-macro2 = "1"
syn = "2.0"

[features]
default = []
tracing = []
log = []
defmt = []